<!-- ==== SECTION 10: CAISSE (POS) - MODERNIZED ==== -->
<div id="caisse-container" class="caisse-modern">
  <!-- Top section with customer info, search, and controls -->
  <div class="caisse-top-section">
    <!-- Customer info and quick actions -->
    <div class="caisse-customer-section">
      <div id="current-customer-display" class="customer-display">
        <span id="customer-name-display">Client: Aucun</span>
        <button id="change-customer-btn" class="btn btn-small">Changer</button>
        <button id="quick-customer-btn" class="btn btn-small">Client rapide</button>
      </div>
      <div class="customer-actions">
        <button id="customer-payment-btn" class="btn btn-small">Paiement dette</button>
        <button id="customer-details-btn" class="btn btn-small">Détails</button>
      </div>
    </div>

    <!-- Search and scanner input -->
    <div class="caisse-search-section">
      <div class="scanner-input-container">
        <input type="text" id="scanner-receiver" class="scanner-input" placeholder="Scanner ou rechercher..." autocomplete="off">
        <div id="scanner-suggestions" class="suggestions-dropdown"></div>
      </div>
      <div class="search-actions">
        <button id="clear-search-btn" class="btn btn-icon" title="Effacer">✕</button>
        <button id="open-product-grid-btn" class="btn">Grille produits</button>
      </div>
    </div>

    <!-- Quick action buttons -->
    <div class="caisse-quick-actions">
      <button id="hold-cart-btn" class="btn">Mettre en attente</button>
      <button id="clear-cart-btn" class="btn btn-warning">Vider</button>
      <button id="promotions-btn" class="btn">Promotions</button>
      <button id="discount-btn" class="btn">Réduction</button>
    </div>
  </div>

  <!-- Main cart section - more prominent -->
  <div class="caisse-main-cart">
    <div class="cart-header">
      <h2>Panier actuel</h2>
      <div class="cart-summary">
        <span id="cart-item-count">0 articles</span>
        <span id="cart-total-amount" class="total-amount">0,00 DA</span>
      </div>
    </div>

    <div id="cart-table-container" class="cart-table-container">
      <table id="cart-table" class="cart-table">
        <thead>
          <tr>
            <th>Produit</th>
            <th>Prix</th>
            <th>Qté</th>
            <th>Total</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="cart-items">
          <!-- Cart items will be rendered here -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Right sidebar with payment and totals -->
  <div class="caisse-sidebar">
    <div class="payment-section">
      <h3>Paiement</h3>
      <div class="payment-methods">
        <button id="cash-payment-btn" class="payment-btn active">Espèces</button>
        <button id="card-payment-btn" class="payment-btn">Carte</button>
        <button id="credit-payment-btn" class="payment-btn">Crédit</button>
        <button id="mixed-payment-btn" class="payment-btn">Mixte</button>
      </div>

      <div class="payment-input">
        <label for="amount-tendered">Montant donné:</label>
        <input type="number" id="amount-tendered" class="payment-input-field" step="0.01" min="0">
        <button id="exact-amount-btn" class="btn btn-small">Exact</button>
      </div>

      <div class="payment-summary">
        <div class="summary-row">
          <span>Sous-total:</span>
          <span id="cart-subtotal" class="amount">0,00 DA</span>
        </div>
        <div class="summary-row">
          <span>Réduction:</span>
          <span id="cart-discount" class="amount">0,00 DA</span>
        </div>
        <div class="summary-row total-row">
          <span>Total:</span>
          <span id="cart-grand-total" class="amount total-amount">0,00 DA</span>
        </div>
        <div class="summary-row">
          <span>Monnaie:</span>
          <span id="change-amount" class="amount">0,00 DA</span>
        </div>
      </div>
    </div>

    <div class="cart-actions">
      <button id="complete-transaction-btn" class="btn btn-large btn-success">Terminer la vente</button>
      <button id="print-receipt-btn" class="btn btn-large">Imprimer ticket</button>
    </div>
  </div>
</div>
